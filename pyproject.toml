[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrag"
version = "0.1.0"
description = "Open-Source Universal Knowledge Intelligence Framework — multimodal RAG with built-in API server, declarative pipelines, and enterprise-grade access control."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "OpenRAG Contributors" }]
keywords = ["rag", "llm", "multimodal", "knowledge-graph", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "anyio>=4.3",
    "python-dotenv>=1.0",
    # API server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "strawberry-graphql[fastapi]>=0.223",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Observability
    "structlog>=24.0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "prometheus-client>=0.20",
    # Utilities
    "httpx>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.22",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "rapidfuzz>=3.8",
    "rank-bm25>=0.2",
    # Phase 1 storage adapters
    "networkx>=3.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
# Document parsers
pdf = ["pymupdf>=1.24"]
office = ["docling>=2.0"]
code = ["tree-sitter>=0.22", "tree-sitter-python>=0.23", "tree-sitter-javascript>=0.23"]
audio = ["openai-whisper>=20240930"]
video = ["ffmpeg-python>=0.2"]
web = ["beautifulsoup4>=4.12", "lxml>=5.2"]
# NLP
nlp = ["spacy>=3.7", "sympy>=1.12"]
# Embeddings
embeddings = ["sentence-transformers>=2.7", "cohere>=5.0"]
# Vector DBs
qdrant = ["qdrant-client>=1.9"]
chroma = ["chromadb>=0.5"]
weaviate = ["weaviate-client>=4.6"]
pgvector = ["asyncpg>=0.29", "pgvector>=0.3"]
pinecone = ["pinecone-client>=3.2"]
# Graph DBs
neo4j = ["neo4j>=5.19"]
arangodb = ["python-arango>=7.9"]
# Document stores
postgres = ["asyncpg>=0.29", "sqlalchemy[asyncio]>=2.0"]
mongo = ["motor>=3.4"]
# Reranking
rerank = ["sentence-transformers>=2.7"]
# All
all = [
    "openrag[pdf,office,code,audio,video,web,nlp,embeddings,qdrant,chroma,neo4j,postgres,rerank]"
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "httpx>=0.27",   # for TestClient
    "locust>=2.24",  # for perf tests
]

[project.scripts]
openrag = "openrag.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/openrag"
Documentation = "https://openrag.readthedocs.io"
Repository = "https://github.com/your-org/openrag"
Issues = "https://github.com/your-org/openrag/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openrag*"]

# ── Ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "ANN", "S", "RET", "SIM"]
ignore = ["S101"]   # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=openrag --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["openrag"]
omit = [
    # Phase 1+ modules — not built yet, stub files only
    "openrag/cli/*",
    "openrag/storage/*",
    "openrag/parsers/*",
    "openrag/pipeline/*",
    "openrag/processors/*",
    "openrag/ingestion/*",
    "openrag/embeddings/*",
    "openrag/knowledge/*",
    "openrag/search/*",
    "openrag/query/*",
    "openrag/server/*",
    "openrag/auth/*",
    "openrag/observability/*",
    "tests/*",
]
